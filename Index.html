<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner UD. BAROKAH</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: white; height: 100vh; display: flex; flex-direction: column; }
        #reader { width: 100%; max-width: 500px; margin: auto; border: 2px solid #0d6efd; border-radius: 15px; overflow: hidden; }
        .info { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="info">
        <h4 class="fw-bold">SCAN BARCODE</h4>
        <p class="small text-secondary">Pastikan izin kamera diizinkan</p>
    </div>

    <div id="reader"></div>

    <div class="p-3">
        <button class="btn btn-outline-light w-100" onclick="goBack()">KEMBALI</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = decodeURIComponent(urlParams.get('return') || '');

        // Validasi URL return
        if (!returnUrl) {
            alert('Error: Parameter "return" tidak ditemukan di URL');
            throw new Error('Missing return URL parameter');
        }

        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
                // Bunyi Beep menggunakan Web Audio API
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                } catch (err) {
                    console.warn('Audio gagal:', err);
                }

                // Kirim balik ke Google Script Kasir
                window.location.href = returnUrl + "&scan=" + encodeURIComponent(decodedText);
            }
        ).catch((err) => {
            alert('Error kamera: ' + err);
            console.error(err);
        });

        function goBack() {
            if (returnUrl) {
                window.location.href = returnUrl;
            } else {
                window.history.back();
            }
        }
    </script>
</body>
</html>
