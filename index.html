<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner UD. BAROKAH</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: white; height: 100vh; display: flex; flex-direction: column; }
        #reader { width: 100%; max-width: 500px; margin: auto; border: 2px solid #0d6efd; border-radius: 15px; overflow: hidden; }
        .info { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="info">
        <h4 class="fw-bold">SCAN BARCODE</h4>
        <p class="small text-secondary">Pastikan izin kamera diizinkan</p>
    </div>

    <div id="reader"></div>

    <div class="p-3">
        <button class="btn btn-outline-light w-100" onclick="goBack()">KEMBALI</button>
    </div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    let returnParam = urlParams.get('return');
    const OFFICIAL_URL = "https://script.google.com/macros/s/AKfycbyKcI5QQVheT_o0Xrx-IFnCOso1ULf4L-06OaB-9PdTR4GKwA1PAijy5Y764I82J5Wz/exec";

    let returnUrl = returnParam ? decodeURIComponent(returnParam) : OFFICIAL_URL;
    if (returnUrl.includes("googleusercontent.com")) { returnUrl = OFFICIAL_URL; }

    const html5QrCode = new Html5Qrcode("reader");
    
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
        try { new Audio('https://www.soundjay.com/buttons/beep-07.mp3').play(); } catch (e) {}

        // --- TRIK SAKTI ---
        // Simpan hasil scan di LocalStorage (kantong browser) agar tidak hilang saat redirect
        localStorage.setItem('lastScan', decodedText);

        setTimeout(() => {
            const finalPath = new URL(returnUrl);
            finalPath.searchParams.set('scan', decodedText);
            // Paksa lompat ke layar utama
            window.top.location.href = finalPath.toString();
        }, 500);
    }).catch(err => { alert("Kamera Error!"); });

    function goBack() { window.top.location.href = returnUrl; }
</script>

</body>
</html>
