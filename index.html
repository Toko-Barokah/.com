<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner UD. BAROKAH</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: white; height: 100vh; display: flex; flex-direction: column; }
        #reader { width: 100%; max-width: 500px; margin: auto; border: 2px solid #0d6efd; border-radius: 15px; overflow: hidden; }
        .info { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="info">
        <h4 class="fw-bold">SCAN BARCODE</h4>
        <p class="small text-secondary">Pastikan izin kamera diizinkan</p>
    </div>

    <div id="reader"></div>

    <div class="p-3">
        <button class="btn btn-outline-light w-100" onclick="goBack()">KEMBALI</button>
    </div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    let returnParam = urlParams.get('return');
    
    // --- PERBAIKAN KRUSIAL DI SINI ---
    // Jika returnParam berisi link internal Google yang "ngaco" (ada tulisan 'userCodeAppPanel'), 
    // kita paksa balik ke link publik Toko Barokah.
    const OFFICIAL_URL = "https://script.google.com/macros/s/AKfycbyKcI5QQVheT_o0Xrx-IFnCOso1ULf4L-06OaB-9PdTR4GKwA1PAijy5Y764I82J5Wz/exec";

    let returnUrl = returnParam ? decodeURIComponent(returnParam) : OFFICIAL_URL;

    // Jika link yang terdeteksi adalah link 'ngeblank' tadi, timpa dengan yang benar
    if (returnUrl.includes("googleusercontent.com")) {
        returnUrl = OFFICIAL_URL;
    }

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };

    html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
        // Bunyi Beep
        try {
            new Audio('https://www.soundjay.com/buttons/beep-07.mp3').play();
        } catch (e) {}

        setTimeout(() => {
            // Gunakan URLSearchParams agar penggabungan link lebih rapi dan tidak error
            const finalPath = new URL(returnUrl);
            finalPath.searchParams.set('scan', decodedText);
            
            // Perintah sakti: window.top.location mematikan proteksi iframe Google
            window.top.location.href = finalPath.toString();
        }, 500);
    }).catch(err => {
        alert("Kamera Error: Pastikan izin kamera aktif!");
    });

    function goBack() {
        window.top.location.href = returnUrl;
    }
    </script>
</body>
</html>
