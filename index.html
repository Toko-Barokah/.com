<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner UD. BAROKAH</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: white; height: 100vh; display: flex; flex-direction: column; }
        #reader { width: 100%; max-width: 500px; margin: auto; border: 2px solid #0d6efd; border-radius: 15px; overflow: hidden; }
        .info { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="info">
        <h4 class="fw-bold">SCAN BARCODE</h4>
        <p class="small text-secondary">Pastikan izin kamera diizinkan</p>
    </div>

    <div id="reader"></div>

    <div class="p-3">
        <button class="btn btn-outline-light w-100" onclick="goBack()">KEMBALI</button>
    </div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const returnParam = urlParams.get('return');
    
    // Pengaman: Jika tidak ada return URL, balikkan ke halaman utama Kasir Anda
    const returnUrl = returnParam ? decodeURIComponent(returnParam) : "https://script.google.com/macros/s/AKfycbyKcI5QQVheT_o0Xrx-IFnCOso1ULf4L-06OaB-9PdTR4GKwA1PAijy5Y764I82J5Wz/exec";

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };

    html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
        // Efek suara
        try {
            const audio = new Audio('https://www.soundjay.com/buttons/beep-07.mp3');
            audio.play();
        } catch (e) { console.log("Audio block by browser"); }

        // Jeda 500ms agar user sempat dengar Beep, lalu kirim data
        setTimeout(() => {
            if (returnUrl.includes("?")) {
                window.location.href = returnUrl + "&scan=" + encodeURIComponent(decodedText);
            } else {
                window.location.href = returnUrl + "?scan=" + encodeURIComponent(decodedText);
            }
        }, 500);
    }).catch(err => {
        console.error("Gagal start kamera", err);
        alert("Kamera tidak diizinkan atau tidak ditemukan.");
    });

    function goBack() {
        window.location.href = returnUrl;
    }
</script>

</body>
</html>
